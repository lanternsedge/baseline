<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baseline Tennis</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baseline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1F17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sticky masthead with tour tabs; each tab is one view of feature + list grids that stack on narrow screens */
:root{
  --bg:#F4EFE1; --surface:#FBF8EF; --fg:#1B2A22; --muted:#4F5B53; --rule:#D9D2BE;
  --green:#1F4D36; --court:#2F6B47; --purple:#5B3A8C; --purple-soft:#E3D9F2; --ball:#D9E021;
  --on-green:#F4EFE1; --live:#B3261E; --notice:#FFF3C4;
  --display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --body:'Source Sans 3', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0F1F17; --surface:#16291F; --fg:#EDE7D6; --muted:#B4BCAE; --rule:#2C4236;
  --green:#9FD3AE; --court:#24543A; --purple:#C7B2EC; --purple-soft:#2E2442;
  --on-green:#0F1F17; --live:#FF8A80; --notice:#3A3418; color-scheme:dark } }

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
a:focus-visible,button:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(24px, env(safe-area-inset-left));padding-right:max(24px, env(safe-area-inset-right))}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px 6px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:36px;height:36px;border-radius:9px}
.logo b{font-family:var(--display);font-weight:700;font-size:28px;color:var(--green)}
.right{display:flex;align-items:center;gap:12px}
.updated{font-size:14px;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--green);cursor:pointer}
.icon-btn.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav::-webkit-scrollbar{display:none}
nav button{font:600 16px var(--body);color:var(--fg);background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;min-height:48px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--purple);border-bottom-color:var(--purple)}

main{padding-block:28px calc(64px + env(safe-area-inset-bottom))}
.view{display:flex;flex-direction:column;gap:32px}
h2{font-family:var(--display);font-weight:700;font-size:26px;color:var(--green);margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.meta{font-size:14px;color:var(--muted)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--green)}
.empty{padding:24px;border:1px dashed var(--rule);border-radius:6px;color:var(--muted)}

.court{position:relative;background:var(--court);overflow:hidden}
.court i{position:absolute;border:3px solid rgba(244,239,225,.7)}
.court .o{left:7%;right:7%;top:12%;bottom:12%}
.court .s{left:22%;right:22%;top:12%;bottom:12%;border-top:0;border-bottom:0}
.court .n{left:50%;top:12%;bottom:12%;width:0;border-width:0 0 0 3px}
.court .t{left:22%;right:22%;top:50%;height:0;border-width:3px 0 0 0}
.court .b{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:#D9E021;right:14%;top:20%;box-shadow:0 6px 12px rgba(0,0,0,.3);border:0}
.play{position:absolute;left:50%;top:50%;width:56px;height:56px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(244,239,225,.95);display:flex;align-items:center;justify-content:center}
.media{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--court)}
.media img{width:100%;height:100%;object-fit:cover}
.media > .court{position:absolute;inset:0}

.lead{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px}
.feature{display:block;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--rule)}
.feature .txt{padding:20px 24px 24px;display:flex;flex-direction:column;gap:6px}
.feature h3{font-size:30px;line-height:1.15}
.feature p{margin:4px 0 0;color:var(--muted);font-size:16px;max-width:65ch}
.list{display:flex;flex-direction:column}
.list > a{display:flex;flex-direction:column;gap:4px;padding:16px 0;border-bottom:1px solid var(--rule)}
.list > a:first-child{padding-top:0}
.list > a:last-child{border-bottom:0}
.list h3{font-size:20px;line-height:1.25}
.list > a.tip{flex-direction:row;padding:14px;border:1px solid var(--rule)}
.list > a.tip h3{font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);min-width:0}
.card h3{font-size:18px;line-height:1.3}
a.card:hover,.feature:hover h3,.list > a:hover h3,a.tip:hover h3{color:var(--purple)}
.ext::after{content:" ↗";font-size:.85em}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:600 15px var(--body);padding:10px 16px;min-height:44px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tip{display:flex;gap:14px;align-items:center;padding:14px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);min-width:0}
.tip .thumb{width:128px;flex:none;border-radius:5px;aspect-ratio:16/9}
.tip .thumb .play{width:34px;height:34px}
.tip .thumb .play svg{width:16px;height:16px}
.tip .doc{background:var(--purple-soft);display:flex;align-items:center;justify-content:center;color:var(--purple)}
.tip h3{font-size:17px;line-height:1.25}
.tip .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.new{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:var(--ball);color:#1B2A22;font-size:11px;letter-spacing:.06em}
.note{font-size:14px;color:var(--muted);max-width:65ch;margin:0}

.sched{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
.panel{padding:20px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column;gap:12px;min-width:0}
.event{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 12px;margin:0 -12px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;font:inherit;color:inherit;width:calc(100% + 24px)}
.event[aria-pressed="true"]{background:var(--purple-soft)}
.event h3{font-size:19px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:4px;background:var(--purple-soft);color:var(--purple)}
.event[aria-pressed="true"] .tag{background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;font:600 15px var(--body);border:1px solid var(--purple);color:var(--purple);background:none;white-space:nowrap;cursor:pointer}
.btn.solid{background:var(--purple);color:var(--bg)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.court-name{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);padding:14px 0 6px;border-bottom:2px solid var(--green)}
.match{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.status{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.live{display:inline-block;padding:3px 8px;border-radius:4px;background:var(--live);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em}
@media (prefers-color-scheme: dark){ .live{color:#0F1F17} }
.players{display:flex;flex-direction:column;gap:4px;min-width:0}
.pl{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.pl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.win{font-weight:700}
.sets{font-variant-numeric:tabular-nums;letter-spacing:.08em;white-space:nowrap}
.sets sup{font-size:10px;letter-spacing:0}
.watch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:center}
.notice{padding:12px 14px;border-radius:6px;background:var(--notice);font-size:15px}
/* Audio briefing */
.player{border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}
.player .stage{position:relative;aspect-ratio:16/8;background:var(--court);overflow:hidden}
.player .stage .court{position:absolute;inset:0}
.player .stage .eq{position:absolute;left:24px;bottom:18px;display:flex;gap:4px;align-items:flex-end;height:28px}
.player .stage .eq span{width:5px;border-radius:2px;background:var(--ball);height:30%}
.player.on .stage .eq span{animation:eq 1s ease-in-out infinite}
.player .stage .eq span:nth-child(2){animation-delay:.2s}.player .stage .eq span:nth-child(3){animation-delay:.4s}.player .stage .eq span:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){ .player.on .stage .eq span{animation:none;height:70%} }
.player .txt{padding:20px 24px 24px;display:flex;flex-direction:column;gap:8px}
.player h3{font-size:30px;line-height:1.15}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.bigplay{width:72px;height:72px;border-radius:50%;border:0;background:var(--green);color:var(--on-green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bigplay svg{width:30px;height:30px}
.skip{width:52px;height:52px;border-radius:50%;border:1px solid var(--rule);background:var(--bg);color:var(--green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.skip:disabled{opacity:.4;cursor:default}
.speed{display:flex;gap:6px;margin-left:auto}
.speed button{font:600 14px var(--body);min-height:40px;min-width:52px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:var(--bg)}
.now{font-size:15px;color:var(--muted);min-height:22px}
.now strong{color:var(--fg)}
.bar{display:flex;gap:3px;height:6px}
.bar i{flex:1;border-radius:3px;background:var(--rule)}
.bar i.done{background:var(--green)}
.bar i.cur{background:var(--purple)}
.stories{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:st}
.stories li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 12px;margin:0 -12px;border-radius:6px;border-bottom:1px solid var(--rule)}
.stories li:last-child{border-bottom:0}
.stories li.cur{background:var(--purple-soft);border-bottom-color:transparent}
.stories .num{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);font:700 15px var(--body);color:var(--green);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.stories li.cur .num{background:var(--purple);border-color:var(--purple);color:var(--bg)}
.stories .s-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.stories h3{font-size:19px;line-height:1.25}
.stories p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.stories a.read{font-size:14px;font-weight:600;color:var(--purple);align-self:flex-start;padding:6px 0}
.eds{display:flex;gap:10px;flex-wrap:wrap}
.eds button{font:inherit;text-align:left;padding:12px 16px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:170px}
.eds button[aria-pressed="true"]{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple)}
.eds strong{font-family:var(--display);font-size:17px}
details.voices{padding:16px 20px;border-radius:6px;background:var(--surface);border:1px solid var(--rule)}
details.voices summary{cursor:pointer;font-weight:700;color:var(--green);min-height:32px;display:flex;align-items:center}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-top:12px}
.vgrid label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;min-width:0}
.vgrid select{font:16px var(--body);min-height:44px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);max-width:100%}
#mini.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
@media (max-width:820px){ .vgrid{grid-template-columns:minmax(0,1fr)} .player h3{font-size:24px} .speed{margin-left:0} }
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;margin-top:32px}

@media (max-width:820px){
  .lead,.sched{grid-template-columns:minmax(0,1fr)}
  .grid3,.tips{grid-template-columns:minmax(0,1fr)}
  .feature h3{font-size:24px}
  .updated{display:none}
}
@media (prefers-reduced-motion:no-preference){ .view{animation:fade .2s ease} @keyframes fade{from{opacity:.5}to{opacity:1}} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="mast">
      <div class="logo"><img src="apple-touch-icon.png" alt="" width="36" height="36"><b>Baseline</b></div>
      <div class="right">
        <span class="updated" id="updated"></span>
        <button class="icon-btn" id="mini" type="button" aria-label="Pause briefing" hidden></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Refresh">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        </button>
      </div>
    </div>
    <nav role="tablist" aria-label="Sections" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><p class="meta">Loading the latest tennis…</p></main>

<script>
'use strict';
const D = { news:null, videos:null, espn:null, cal:null, lib:null, status:null };
const PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#1F4D36"/></svg>';
const DOC = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6M9 19h3"/></svg>';
const courtInner = (ball=true, play=false) => `<i class="o"></i><i class="s"></i><i class="n"></i><i class="t"></i>${ball?'<i class="b"></i>':''}${play?`<span class="play">${PLAY}</span>`:''}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const A = (u, inner, cls='') => `<a href="${safeUrl(u)}" target="_blank" rel="noopener" class="${cls}">${inner}</a>`;
const DAY = 864e5;
const ago = iso => {
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.round((Date.now() - t) / 6e4);
  if (m < 60) return Math.max(m,1) + 'm ago';
  if (m < 1440) return Math.round(m/60) + 'h ago';
  return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
};
const ytId = u => (String(u).match(/[?&]v=([\w-]{11})/) || [])[1];
const media = (img, play=false) => `<div class="media">${img ? `<div class="court">${courtInner(false)}</div><img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">${play?`<span class="play">${PLAY}</span>`:''}` : `<div class="court">${courtInner(!play, play)}</div>`}</div>`;
const tourLabel = n => n.tour === 'TOUR' ? 'Tennis' : n.tour;

async function loadJSON(name){
  try { const r = await fetch('data/' + name + '?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) throw 0; return await r.json(); }
  catch { return null; }
}
async function loadAll(){
  const [news, videos, espn, cal, lib, briefs] = await Promise.all(['news.json','videos.json','espn.json','calendar.json','library.json','briefings.json'].map(loadJSON));
  Object.assign(D, {news, videos, espn, cal, lib, briefs});
}

/* ---------- News ---------- */
function newsView(items, title){
  if (!items.length) return `<section class="view"><div class="empty">No ${esc(title)} stories in the last few days. Check back soon.</div></section>`;
  const f = items.find(n => n.image) || items[0];
  const rest = items.filter(n => n !== f);
  const side = rest.slice(0,3), more = rest.slice(3,30);
  const line = n => `<span class="meta ext">${esc(n.source)} · ${ago(n.date)}</span>`;
  return `<section class="view">
   <div class="lead">
    ${A(f.link, `${media(f.image)}<div class="txt"><span class="eyebrow">${esc(title)} · ${esc(tourLabel(f))}</span><h3>${esc(f.title)}</h3>${f.desc?`<p>${esc(f.desc.slice(0,180))}${f.desc.length>180?'…':''}</p>`:''}${line(f)}</div>`, 'feature')}
    <div class="list">${side.map(n => A(n.link, `<span class="eyebrow">${esc(tourLabel(n))}</span><h3>${esc(n.title)}</h3>${line(n)}`)).join('')}</div>
   </div>
   ${more.length ? `<div class="section-head"><h2>More headlines</h2></div>
   <div class="grid3">${more.map(n => A(n.link, `<span class="eyebrow">${esc(tourLabel(n))}</span><h3>${esc(n.title)}</h3>${line(n)}`, 'card')).join('')}</div>` : ''}
  </section>`;
}
const newsItems = () => D.news?.items || [];
function slamsView(){
  const items = newsItems().filter(n => n.slam);
  const majors = D.lib?.majors || [];
  return `<section class="view">
    ${items.length ? newsView(items, 'Grand Slams').replace(/^<section class="view">/,'<div class="view">').replace(/<\/section>\s*$/,'</div>') : '<div class="empty">No Grand Slam news this week. The next major is the Australian Open in January.</div>'}
    <div class="section-head"><h2>The four majors</h2></div>
    <div class="tips">${majors.map(s => A(s.url, `<div class="thumb court">${courtInner(false)}</div><div class="body"><span class="eyebrow">${esc(s.when)}</span><h3>${esc(s.name)}</h3><span class="meta ext">${esc(s.where)}</span></div>`, 'tip')).join('')}</div>
  </section>`;
}

/* ---------- Pro Tips ---------- */
const CATS = ['Technique','Training','Injury Prevention','Rehab','Fitness & Recovery'];
let tipCat = 'Today’s Picks';
const dayNo = Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / DAY);
function freshFor(cat){
  const now = Date.now();
  return (D.videos?.items || []).filter(v => v.cat === cat && now - Date.parse(v.date) < 45*DAY)
    .map(v => ({...v, score: (v.views||0) / Math.sqrt((now - Date.parse(v.date))/DAY + 1), fresh:true}))
    .sort((a,b) => b.score - a.score);
}
const libFor = cat => (D.lib?.tips || []).filter(t => t.cat === cat);
function pickFor(cat){
  const f = freshFor(cat).slice(0,3), l = libFor(cat);
  if (f.length && (dayNo % 2 === 0 || !l.length)) return f[dayNo % f.length];
  return l.length ? l[dayNo % l.length] : f[0];
}
function thumbOf(x){ return x.thumb || (ytId(x.link) ? `https://i.ytimg.com/vi/${ytId(x.link)}/hqdefault.jpg` : ''); }
function tipCard(x, cat){
  const isVid = x.kind === 'Video', th = thumbOf(x);
  const thumb = isVid ? `<div class="thumb media">${th?`<img src="${esc(th)}" alt="" loading="lazy" onerror="this.remove()">`:`<div class="court">${courtInner(false)}</div>`}<span class="play">${PLAY}</span></div>` : `<div class="thumb doc">${DOC}</div>`;
  const stats = x.views ? ` · ${x.views >= 1e6 ? (x.views/1e6).toFixed(1)+'M' : x.views >= 1e3 ? Math.round(x.views/1e3)+'K' : x.views} views` : '';
  return A(x.link, `${thumb}<div class="body"><span class="eyebrow">${cat ? esc(cat)+' · ' : ''}${esc(x.kind)}${x.fresh?'<span class="new">NEW</span>':''}</span><h3>${esc(x.title)}</h3><span class="meta ext">${esc(x.source)}${stats}</span></div>`, 'tip');
}
function tipsView(){

const SCORES = {ATP:'https://www.atptour.com/en/scores/current', WTA:'https://www.wtatennis.com/scores'};
let selEvent = null, selDay = 0, liveTimer = null;
const localDay = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const today0 = () => localDay(Date.now());
const evStart = e => Date.parse(e.start + 'T00:00:00');
const evEnd = e => Date.parse(e.end + 'T23:59:59');
const tokens = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z]+/).filter(w => w.length > 3 && !['open','tennis','championships','masters','tournament','international','presented','cup'].includes(w));
function espnFor(ev){
  const names = new Set([...tokens(ev.name), ...tokens(ev.city), ...(ev.aliases||[]).flatMap(tokens)]);
  return (D.espn?.events || []).filter(x => x.tour === ev.tour && (!x.end || Date.parse(x.end) >= evStart(ev) - DAY) && (!x.start || Date.parse(x.start) <= evEnd(ev) + DAY)
    && [...tokens(x.name), ...tokens(x.city)].some(w => names.has(w)))
    .sort((a, b) => b.matches.length - a.matches.length)[0];
}
function thisWeek(){
  const now = Date.now();
  return (D.cal?.events || []).filter(e => evStart(e) <= now && evEnd(e) >= now);
}
function upcoming(){
  const now = Date.now();
  return (D.cal?.events || []).filter(e => evStart(e) > now).sort((a,b) => evStart(a) - evStart(b));
}
function calendarDrift(){
  // Events the score feed is covering now that aren't in Baseline's calendar (often smaller WTA 125 or Challenger events).
  const week = thisWeek();
  const used = new Set(week.map(espnFor).filter(Boolean));
  return (D.espn?.events || []).filter(x => !used.has(x) && x.matches.length && !week.some(e => e.tour === x.tour && [...tokens(e.name), ...tokens(e.city), ...(e.aliases||[]).flatMap(tokens)].some(w => tokens(x.name).includes(w))))
    .map(x => `${x.name} (${x.tour})`);
}
const fmtTime = t => new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const fmtDate = s => new Date(s + 'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
function setsHtml(p){ return p.sets.map(s => `${s.g ?? ''}${s.tb != null ? `<sup>${s.tb}</sup>` : ''}`).join(' '); }
function matchRow(m){
  let st;
  if (m.state === 'in') st = '<span class="live">LIVE</span>';
  else if (m.completed || m.state === 'post') st = 'Final';
  else st = m.date ? fmtTime(m.date) : esc(m.detail || '');
  const ps = m.players.length ? m.players : [{name:'TBD',sets:[]},{name:'TBD',sets:[]}];
  const q = encodeURIComponent(ps.map(p => p.name).join(' vs ') + ' highlights');
  const action = (m.completed || m.state === 'post')
    ? `<a class="btn small" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Highlights</a>`
    : `<button class="btn small${m.state==='in'?' solid':''}" type="button" data-watch>${m.state==='in'?'Watch':'Where to watch'}</button>`;
  return `<div class="match"><div class="status">${st}</div><div class="players">${ps.map(p => `<div class="pl${p.winner?' win':''}"><span>${esc(p.name)}${p.country?` <span class="meta">${esc(p.country)}</span>`:''}</span><span class="sets">${setsHtml(p)}</span></div>`).join('')}${m.round?`<span class="meta">${esc(m.round)}${m.state!=='in'&&m.detail&&!m.completed&&m.state!=='pre'?' · '+esc(m.detail):''}</span>`:''}</div>${action}</div>`;
}
function orderOfPlay(ev){
  const x = espnFor(ev);
  const head = `<div class="section-head" style="border:0;padding:0"><div><span class="eyebrow">Order of play</span><h2>${esc(ev.name)}</h2></div>
    <div class="chips" role="group" aria-label="Day">${[['Yesterday',-1],['Today',0],['Tomorrow',1]].map(([l,o]) => `<button type="button" data-day="${o}" aria-pressed="${o===selDay}">${l}</button>`).join('')}</div></div>
    <span class="meta">Times in your local time · Singles</span>`;
  if (!x || !x.matches.length) return `<div class="panel">${head}<div class="empty">Match details for this event aren't in the score feed yet. The official page has every match.</div><div>${A(SCORES[ev.tour], ev.tour==='ATP'?'ATP Live Scores':'WTA Match Centre', 'btn solid')}</div></div>`;
  const day = today0() + selDay*DAY;
  const ms = x.matches.filter(m => m.date && localDay(Date.parse(m.date)) === day);
  if (!ms.length) return `<div class="panel">${head}<div class="empty">No singles matches listed for this day.</div><div>${A(SCORES[ev.tour], 'Official scores', 'btn')}</div></div>`;
  const courts = new Map();
  ms.sort((a,b) => (a.state==='in'?-1:0) - (b.state==='in'?-1:0) || Date.parse(a.date) - Date.parse(b.date));
  for (const m of ms) { const c = m.court || 'Court to be announced'; if (!courts.has(c)) courts.set(c, []); courts.get(c).push(m); }
  return `<div class="panel">${head}${[...courts].map(([c, list]) => `<div class="court-name">${esc(c)}</div>${list.map(matchRow).join('')}`).join('')}<div style="padding-top:8px">${A(SCORES[ev.tour], 'Official scores', 'btn')}</div></div>`;
}
function schedView(){
  const week = thisWeek(), next = upcoming();
  if (!selEvent || !week.includes(selEvent)) selEvent = week.find(e => espnFor(e)) || week[0] || null;
  const drift = calendarDrift();
  const lc = D.cal?.lastChecked ? new Date(D.cal.lastChecked + 'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—';
  const watch = D.lib?.watch || [];
  const evBtn = e => `<button class="event" type="button" data-ev="${esc(e.name)}" aria-pressed="${e===selEvent}"><div><span class="tag">${esc(e.category)}</span><h3 style="margin-top:6px">${esc(e.name)}</h3><span class="meta">${esc(e.city)}, ${esc(e.country)} · ${esc(e.surface)}${espnFor(e)?'':' · official page only'}</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`;
  return `<section class="view">
   ${drift.length ? `<div class="notice">Also in the score feed this week: <strong>${drift.map(esc).join(', ')}</strong>. ${drift.length>1?'These aren\'t':'This isn\'t'} in Baseline's calendar. Usually that means a smaller event, but if a tour event is missing, the weekly calendar check will add it.</div>` : ''}
   <div class="sched">

     <div class="panel">
      <h2>This week</h2>
      <div>${week.length ? ['ATP','WTA'].map(t => week.filter(e => e.tour===t).map(evBtn).join('')).join('') : '<div class="empty">No tour events this week.</div>'}</div>
      <span class="meta">Calendar last checked: ${lc}</span>
     </div>
     <div class="panel" id="watch">
      <h2>Where to watch in the US</h2>
      <div class="watch">${watch.map(w => `<div><strong>${esc(w.name)}</strong><div class="meta">${esc(w.what)}</div></div>${A(w.url,'Open','btn small')}`).join('')}</div>
      <span class="meta">TV rights change by tournament. Check the listing before match day. A subscription to the service is needed to watch.</span>
     </div>
    </div>
    ${selEvent ? orderOfPlay(selEvent) : `<div class="panel"><h2>Order of play</h2><div class="empty">Nothing on court this week.</div><div style="display:flex;gap:10px;flex-wrap:wrap">${A(SCORES.ATP,'ATP Live Scores','btn solid')}${A(SCORES.WTA,'WTA Match Centre','btn solid')}</div></div>`}
   </div>
   <div class="section-head"><h2>Coming up</h2></div>
   <div class="grid3">${next.slice(0,9).map(e => `<div class="card"><span class="eyebrow">${fmtDate(e.start)} – ${fmtDate(e.end)}</span><h3>${esc(e.name)}</h3><span class="meta">${esc(e.tour)} · ${esc(e.category)} · ${esc(e.city)}</span></div>`).join('') || '<div class="empty">The next season\'s calendar will appear here once it is published.</div>'}</div>
  </section>`;
}
// Try ESPN directly for fresher scores while the Schedule tab is open; fall back to the cached file.
async function liveRefresh(){
  try {
    const out = [];
    for (const tour of ['atp','wta']) {
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/tennis/${tour}/scoreboard`, {cache:'no-store'});
      if (!r.ok) throw 0;
      const j = await r.json();
      for (const ev of j.events || []) for (const g of ev.groupings || []) for (const c of g.competitions || []) out.push([c.id, c]);
    }
    const byId = new Map(out);
    for (const ev of D.espn?.events || []) for (const m of ev.matches) {
      const c = byId.get(m.id); if (!c) continue;
      const st = c.status?.type || {};
      m.state = st.state || m.state; m.completed = !!st.completed; m.detail = st.shortDetail || m.detail;
      (c.competitors||[]).sort((a,b)=>(a.order??0)-(b.order??0)).forEach((p,i) => { if (m.players[i]) { m.players[i].winner = !!p.winner; m.players[i].sets = (p.linescores||[]).map(l => ({g:l.value, tb:l.tiebreak})); } });
    }
    if (current === 'schedule') render(false);
  } catch { /* the browser may not be allowed to read ESPN directly; the 30-minute cached file is used instead */ }
}

/* ---------- Audio briefing ---------- */
// Read aloud on the iPad with Apple's British voices (Web Speech API), alternating a male and a female voice story by story.
const TTS = 'speechSynthesis' in window ? window.speechSynthesis : null;
const ICON = {
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>',
  prev:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>',
  next:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg>',
};
const MALE = /\b(daniel|arthur|oliver|malcolm|fred|jamie|george|harry|rishi|ryan|thomas|male)\b/i;
const FEMALE = /\b(kate|serena|martha|stephanie|moira|fiona|libby|sonia|maisie|susan|hazel|female)\b/i;
const A$ = { edId:null, segs:[], pos:0, playing:false, gen:0, rate:1, lock:null, voices:[] };
try { A$.rate = +localStorage.getItem('rate') || 1; } catch {}
const words = s => (String(s||'').match(/\S+/g) || []).length;
const ord = n => n + (n%100>=11 && n%100<=13 ? 'th' : ['th','st','nd','rd'][n%10] || 'th');
const spokenDate = d => { const t = new Date(d + 'T12:00:00'); return `${t.toLocaleDateString('en-GB',{weekday:'long'})} the ${ord(t.getDate())} of ${t.toLocaleDateString('en-GB',{month:'long'})}`; };
const shortDate = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const sentences = s => (String(s).replace(/\s+/g,' ').trim().match(/[^.!?]+(?:[.!?]+["'”’)\]]*|$)\s*/g) || []).map(x => x.trim()).filter(Boolean);
const endStop = s => /[.!?]["'”’]?$/.test(s.trim()) ? s.trim() : s.trim() + '.';

function loadVoices(){
  if (!TTS) return;
  const gb = TTS.getVoices().filter(v => /^en[-_]gb/i.test(v.lang));
  A$.voices = gb.length ? gb : TTS.getVoices().filter(v => /^en/i.test(v.lang));
}
const quality = v => (/premium/i.test(v.name) ? 3 : /enhanced/i.test(v.name) ? 2 : 1) + (v.localService ? .5 : 0);
function voiceFor(kind){
  let saved = ''; try { saved = localStorage.getItem('voice' + kind) || ''; } catch {}
  const vs = A$.voices; if (!vs.length) return null;
  const s = vs.find(v => v.voiceURI === saved); if (s) return s;
  const re = kind === 'M' ? MALE : FEMALE;
  const pool = vs.filter(v => re.test(v.name));
  return (pool.length ? pool : vs).slice().sort((a,b) => quality(b) - quality(a))[0];
}
const editions = () => D.briefs?.editions || [];
const curEdition = () => editions().find(e => e.id === A$.edId) || editions()[0] || null;
function greeting(ed){ return ed.edition === 'Evening' ? 'Good evening' : ed.edition === 'Midday' ? 'Good afternoon' : 'Good morning'; }
function buildSegs(ed){
  const segs = [], n = ed.stories.length;
  const intro = ed.intro || `${greeting(ed)}, and welcome to the Baseline ${ed.edition.toLowerCase()} briefing for ${spokenDate(ed.date)}. ${n === 1 ? 'One story' : n + ' stories'} today.`;
  sentences(intro).forEach(t => segs.push({story:-1, text:t, v:'F'}));
  ed.stories.forEach((s, i) => {
    const v = i % 2 === 0 ? 'M' : 'F';
    segs.push({story:i, text:`Story ${i+1}. From ${s.source}, ${spokenDate(s.date)}.`, v});
    segs.push({story:i, text:endStop(s.title), v});
    sentences(s.summary).forEach(t => segs.push({story:i, text:t, v}));
  });
  sentences(ed.outro || 'That’s the briefing. The full stories are linked in the Audio tab. Enjoy your tennis.').forEach(t => segs.push({story:n, text:t, v:'F'}));
  return segs;
}
const curStory = () => A$.segs[A$.pos]?.story ?? -1;
function startEdition(ed, story = -1){
  if (A$.edId !== ed.id || !A$.segs.length) { A$.edId = ed.id; A$.segs = buildSegs(ed); }
  A$.pos = story < 0 ? 0 : Math.max(0, A$.segs.findIndex(s => s.story === story));
  play();
}
async function keepAwake(on){
  try {
    if (on && !A$.lock && navigator.wakeLock) { A$.lock = await navigator.wakeLock.request('screen'); A$.lock.addEventListener('release', () => { A$.lock = null; }); }
    if (!on && A$.lock) { await A$.lock.release(); A$.lock = null; }
  } catch { A$.lock = null; }
}
function play(){
  if (!TTS) return;
  loadVoices();
  A$.playing = true; A$.gen++; TTS.cancel();
  keepAwake(true); speakNext(A$.gen); paintAudio();
}
function pause(){
  A$.playing = false; A$.gen++; TTS && TTS.cancel(); keepAwake(false); paintAudio();
}
function speakNext(gen){
  if (gen !== A$.gen || !A$.playing) return;
  const seg = A$.segs[A$.pos];
  if (!seg) { A$.playing = false; A$.pos = 0; keepAwake(false); paintAudio(); return; }
  const u = new SpeechSynthesisUtterance(seg.text);
  const v = voiceFor(seg.v);
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
  u.rate = A$.rate; u.pitch = 1;
  const advance = () => {
    if (gen !== A$.gen) return;
    const prev = A$.segs[A$.pos]; A$.pos++;
    const nxt = A$.segs[A$.pos];
    paintAudio();
    setTimeout(() => speakNext(gen), nxt && prev && nxt.story !== prev.story ? 900 : 120);
  };
  u.onend = advance;
  u.onerror = e => { if (e.error === 'interrupted' || e.error === 'canceled') return; advance(); };
  TTS.speak(u);
}
function skip(dir){
  if (!A$.segs.length) return;
  const s = curStory(), first = A$.segs.findIndex(x => x.story === s);
  let target;
  if (dir > 0) target = s + 1;
  else target = (A$.pos - first > 2 || s < 0) ? s : s - 1;
  const i = A$.segs.findIndex(x => x.story === target);
  A$.pos = i < 0 ? (dir > 0 ? A$.segs.length - 1 : 0) : i;
  if (A$.playing) play(); else paintAudio();
}
function setRate(r){ A$.rate = r; try { localStorage.setItem('rate', r); } catch {} if (A$.playing) play(); else paintAudio(); }
function minutes(ed){ const w = buildSegs(ed).reduce((t,s) => t + words(s.text), 0); return Math.max(1, Math.round(w / 155 / A$.rate)); }

      </div>
      <div class="bar" id="bar" aria-hidden="true">${ed.stories.map(() => '<i></i>').join('')}</div>
      <div class="now" id="now" aria-live="polite"></div>
     </div>
    </div>
    <div>
     <div class="section-head" style="margin-bottom:8px"><h2>In this edition</h2><span class="meta">Tap a number to listen from there</span></div>
     <ol class="stories" id="stories">${ed.stories.map((s,i) => `<li data-i="${i}">
       <button class="num" type="button" data-story="${i}" aria-label="Play story ${i+1}">${i+1}</button>
       <div class="s-body"><span class="eyebrow">${esc(s.source)} · ${esc(shortDate(s.date))}</span><h3>${esc(s.title)}</h3><p>${esc(s.summary)}</p>${A(s.link, 'Read the full story', 'read ext')}</div>

    </div>

   <div class="eds" role="group" aria-label="Editions">${eds.map(e => `<button type="button" data-ed="${esc(e.id)}" aria-pressed="${e.id===ed.id}"><span class="eyebrow">${esc(shortDate(e.date))}</span><strong>${esc(e.edition)} edition</strong><span class="meta">${e.stories.length} stories · ${minutes(e)} min</span></button>`).join('')}</div>` : ''}
   ${voicesPanel()}
   <p class="note">Summaries are written for Baseline in its own words; each links to the original article. The iPad stops reading aloud once the screen locks; newer iPads stay awake while the briefing plays, and on older ones you can lengthen Auto-Lock in Settings › Display &amp; Brightness.</p>
  </section>`;
}
function voicesPanel(){
  loadVoices();
  const vs = A$.voices;
  const opts = kind => { const cur = voiceFor(kind); return vs.map(v => `<option value="${esc(v.voiceURI)}"${cur && v.voiceURI===cur.voiceURI?' selected':''}>${esc(v.name)}${v.lang && !/^en-gb/i.test(v.lang.replace('_','-'))?' ('+esc(v.lang)+')':''}</option>`).join(''); };
  const best = vs.some(v => quality(v) >= 2);
  return `<details class="voices"${best?'':' open'}>
   <summary>Voices</summary>
   ${vs.length ? `<div class="vgrid">
     <label>Male voice (stories 1, 3, 5…)<select data-voice="M">${opts('M')}</select></label>
     <label>Female voice (intro and stories 2, 4, 6…)<select data-voice="F">${opts('F')}</select></label>
   </div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;padding-top:12px"><button class="btn small" type="button" data-sample="M">Hear male voice</button><button class="btn small" type="button" data-sample="F">Hear female voice</button></div>` : '<p class="meta">Voices are still loading. Reopen this tab in a moment.</p>'}
   <p class="note" style="padding-top:12px">${best ? 'For the most natural sound,' : 'These voices sound robotic. For a much more natural sound,'} download Apple's Enhanced or Premium British voices (free): Settings › Accessibility › Spoken Content (called Speech on older iPads) › Voices › English, then under English (UK) choose Daniel, Arthur or Oliver and Kate, Serena or Martha and tap download. Reopen Baseline and pick them here.</p>
  </details>`;
}
function sample(kind){
  if (!TTS) return;
  pause(); loadVoices();
  const u = new SpeechSynthesisUtterance(kind === 'M' ? 'Good morning. Here is the latest from the tour, read for Baseline.' : 'And now, from Wimbledon to Melbourne, the stories that matter today.');
  const v = voiceFor(kind); if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = A$.rate; TTS.speak(u);
}
function paintAudio(){
  const mini = document.getElementById('mini');
  mini.hidden = !(A$.playing && current !== 'audio');
  mini.className = 'icon-btn' + (A$.playing ? ' on' : '');
  mini.innerHTML = `<span style="display:inline-flex;width:20px;height:20px">${ICON.pause}</span>`;
  const p = document.getElementById('player'); if (!p) return;
  const ed = curEdition(); if (!ed) return;
  p.classList.toggle('on', A$.playing);
  const bp = document.getElementById('bigplay');
  bp.innerHTML = A$.playing ? ICON.pause : ICON.play; bp.setAttribute('aria-label', A$.playing ? 'Pause' : (A$.pos ? 'Resume' : 'Play'));
  const s = curStory(), n = ed.stories.length;
  [...document.querySelectorAll('#bar i')].forEach((b,i) => { b.className = i < s ? 'done' : i === s ? 'cur' : ''; });
  [...document.querySelectorAll('#stories li')].forEach((li,i) => li.classList.toggle('cur', i === s && (A$.playing || A$.pos > 0)));
  const st = ed.stories[s];
  document.getElementById('now').innerHTML = !A$.playing && !A$.pos ? 'Tap play to listen.' :
    st ? `${A$.playing?'Now reading':'Paused at'} <strong>story ${s+1} of ${n}</strong> · ${esc(st.source)}` :
    s < 0 ? (A$.playing ? 'Introduction' : 'Paused at the introduction') : 'Sign-off';
  const cur = document.querySelector('#stories li.cur');
  if (cur && A$.playing && current === 'audio') { const r = cur.getBoundingClientRect(); if (r.top < 120 || r.bottom > innerHeight) cur.scrollIntoView({behavior:'smooth', block:'center'}); }
}
if (TTS) { loadVoices(); TTS.addEventListener?.('voiceschanged', () => { const n = A$.voices.length; loadVoices(); if (A$.voices.length !== n && current === 'audio' && !A$.playing) render(false); }); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && A$.playing) keepAwake(true); });

/* ---------- shell ---------- */
const VIEWS = {
  top:{label:'Top Stories', r:() => newsView(newsItems(), 'Top story')},
  audio:{label:'Audio', r:audioView},
  atp:{label:'ATP', r:() => newsView(newsItems().filter(n => n.tour==='ATP'), 'ATP')},
  wta:{label:'WTA', r:() => newsView(newsItems().filter(n => n.tour==='WTA'), 'WTA')},
  slams:{label:'Grand Slams', r:slamsView},
  schedule:{label:'Schedule', r:schedView},
  tips:{label:'Pro Tips', r:tipsView},
};
const tabs = document.getElementById('tabs'), main = document.getElementById('main');
let current = (location.hash || '').slice(1);
if (!VIEWS[current]) { try { current = localStorage.getItem('tab') || 'top'; } catch { current = 'top'; } }
if (!VIEWS[current]) current = 'top';
function render(top=true){
  tabs.innerHTML = Object.entries(VIEWS).map(([k,v]) => `<button role="tab" type="button" aria-selected="${k===current}" data-k="${k}">${v.label}</button>`).join('');
  main.innerHTML = VIEWS[current].r() + `<p class="foot">Headlines link to the original publishers. Articles open in Safari.</p>`;
  const g = D.news?.generatedAt; document.getElementById('updated').textContent = g ? 'Updated ' + ago(g) : '';
  if (top) window.scrollTo(0,0);
  paintAudio();
  clearInterval(liveTimer);
  if (current === 'schedule') { liveTimer = setInterval(liveRefresh, 60000); }
}
tabs.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; current = b.dataset.k; try{localStorage.setItem('tab',current)}catch{} render(); if (current==='schedule') liveRefresh(); });
main.addEventListener('click', e => {
  const a = e.target.closest('button[data-a]');
  if (a) { const k = a.dataset.a, ed = curEdition();
    if (k === 'toggle') { if (A$.playing) pause(); else if (ed) { if (!A$.segs.length || A$.edId !== ed.id) startEdition(ed); else play(); } }
    else skip(k === 'next' ? 1 : -1);
    return; }
  const st = e.target.closest('button[data-story]'); if (st) { const ed = curEdition(); if (ed) startEdition(ed, +st.dataset.story); return; }
  const r = e.target.closest('button[data-rate]'); if (r) { setRate(+r.dataset.rate); [...document.querySelectorAll('button[data-rate]')].forEach(b => b.setAttribute('aria-pressed', b === r)); return; }
  const ed = e.target.closest('button[data-ed]'); if (ed) { if (ed.dataset.ed !== A$.edId) { pause(); A$.edId = ed.dataset.ed; A$.segs = []; A$.pos = 0; } render(false); return; }
  const sm = e.target.closest('button[data-sample]'); if (sm) { sample(sm.dataset.sample); return; }
  const c = e.target.closest('button[data-cat]'); if (c) { tipCat = c.dataset.cat; render(false); return; }
  const ev = e.target.closest('button[data-ev]'); if (ev) { selEvent = thisWeek().find(x => x.name === ev.dataset.ev); selDay = 0; render(false); return; }
  const d = e.target.closest('button[data-day]'); if (d) { selDay = +d.dataset.day; render(false); return; }
  if (e.target.closest('button[data-watch]')) document.getElementById('watch')?.scrollIntoView({behavior:'smooth', block:'start'});
});
main.addEventListener('change', e => { const v = e.target.closest('select[data-voice]'); if (v) { try { localStorage.setItem('voice' + v.dataset.voice, v.value); } catch {} if (A$.playing) play(); } });
document.getElementById('mini').addEventListener('click', pause);
const refreshBtn = document.getElementById('refresh');
async function refresh(){ refreshBtn.classList.add('spin'); await loadAll(); render(false); refreshBtn.classList.remove('spin'); }
refreshBtn.addEventListener('click', refresh);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
loadAll().then(() => { render(); if (current==='schedule') liveRefresh(); });
</script>
</body>
</html>
